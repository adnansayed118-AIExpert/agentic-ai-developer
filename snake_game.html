<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Snake Game</title>
    <style>
        /* Add your CSS here for improved visuals */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fafafa;
        }
        canvas {
            border: 1px solid black;
        }
        .hidden-gift {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div id="completionMessage"></div>
    <div id="gifts" class="hidden-gift"></div>
    <script>
        // JavaScript for the game logic with enhancements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let snake = [ {x: 9, y: 9} ];
        let food = {x: 5, y: 5};
        let score = 0;
        let stage = 1;
        const stagesText = ["Great job! Stage 1 completed!","Nice! Stage 2 done!","Well done! Stage 3 clearance!","Good work! Stage 4 achieved!","Awesome! You completed Stage 5!","Fantastic! Stage 6 finished!","Incredible! Stage 7 done!","Outstanding! Stage 8 achieved!"];

        function drawSnake() {
            ctx.fillStyle = 'lightgreen';
            snake.forEach(part => {
                ctx.fillRect(part.x * 20, part.y * 20, 18, 18);
                // Add eyes and mouth depending on snake direction
            });
        }

        function drawFood() {
            ctx.fillStyle = 'yellow'; // Eggs
            ctx.fillRect(food.x * 20, food.y * 20, 18, 18);
            // Add visual texture for eggs
        }

        function displayCompletionMessage() {
            document.getElementById('completionMessage').innerText = stagesText[stage - 1];
        }

        function showGifts() {
            // Show hidden gifts logic based on stage
            const gifts = document.getElementById('gifts');
            gifts.style.display = 'block';
            // Add logic for gift types
        }

        function gameLoop() {
            // Main game loop with smooth animations
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawSnake();
            drawFood();
            // Handle game logic and update graphics with particle effects
            // Include scoring for gifts
        }

        setInterval(gameLoop, 100);
    </script>
</body>
</html>
